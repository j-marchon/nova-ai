<!doctype html>
<html lang="en" class="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#000000" />
    <!-- DNS, TCP and TLS to OpenRouter are all done before the first message
         is sent, rather than being paid inside the send. On mobile data that
         handshake is regularly 300-600ms of the wait before a reply starts. -->
    <link rel="preconnect" href="https://openrouter.ai" crossorigin />
    <link rel="dns-prefetch" href="https://openrouter.ai" />
    <link rel="preload" href="/src/assets/fonts/OverusedGroteskRoman-VF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nova" />
    <title>Nova</title>
  </head>
